# SonarCloud Configuration for Hummingbot Candles Feed

# Project identification
sonar.projectKey=MementoRC_hb-candles-feed
sonar.organization=mementorc

# Project information
sonar.projectName=Hummingbot Candles Feed
sonar.projectDescription=A high-performance candles feed system for cryptocurrency trading with Hummingbot integration
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=candles_feed
sonar.tests=tests

# Language and file patterns
sonar.python.version=3.10,3.11,3.12
sonar.inclusions=**/*.py
sonar.exclusions=**/mocking_resources/**,**/__pycache__/**,**/.*,**/*.pyc,setup.py

# Test configuration
sonar.test.inclusions=tests/**/*.py
sonar.test.exclusions=**/conftest.py,**/__pycache__/**

# Coverage configuration
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Code analysis configuration
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Quality gate configuration
sonar.qualitygate.wait=true

# Duplication configuration
sonar.cpd.python.minimumtokens=50

# Issue exclusions for specific patterns
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Exclude mocking resources from analysis
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/mocking_resources/**

# Exclude generated files
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/__about__.py

# Exclude test-specific issues
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S101  # Test assertions
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**

# Exclude docstring requirements for private methods in tests
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S1542
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**

# Exclude complexity rules for test files
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e5.resourceKey=tests/**

# New code period
sonar.newCode.referenceBranch=main

# Security configuration
sonar.security.hotspots.inheritFromParent=true
