name: Python Performance Monitoring Alerts

on:
  workflow_run:
    workflows: ["Enhanced Package CI"] # Match the name of your main CI workflow
    types:
      - completed

permissions:
  actions: read    # To download artifacts
  contents: read   # To checkout the repo

jobs:
  notify-on-performance-degradation:
    name: Notify on Performance Degradation (Python)
    runs-on: ubuntu-latest
    # Run only if the triggering workflow (Enhanced Package CI) was successful
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit # Allows all outbound traffic, refine if webhook IPs are known

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the specific commit that the CI workflow ran on
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.event.workflow_run.id }} # Must match artifact name in ci.yml
          path: benchmark-data # Download to this directory in the workspace
          github-token: ${{ secrets.GITHUB_TOKEN }} # Required for downloading artifacts from other workflows
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Specify your project's Python version

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project itself and its dependencies (including aiohttp for notifications)
          # This assumes your pyproject.toml is set up for 'pip install .'
          pip install .
          # If you have specific requirements for scripts, you might list them:
          # pip install aiohttp pydantic # if not covered by 'pip install .' for this context

      - name: Run Python performance alert script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BENCHMARK_FILE_PATH: benchmark-data/benchmark-results/benchmark-results.json # Relative to workspace root
          PERFORMANCE_ALERT_THRESHOLD_MS: ${{ vars.PERFORMANCE_ALERT_THRESHOLD_MS }}
          DEGRADATION_THRESHOLD_PERCENT: ${{ vars.DEGRADATION_THRESHOLD_PERCENT }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_NAME: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          # TASKMASTER_ID: If you extract Task ID in GHA, pass it here. Otherwise, Python script can try.
        run: |
          python scripts/send_performance_alerts.py
