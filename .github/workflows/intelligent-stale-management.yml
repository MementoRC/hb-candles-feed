name: Intelligent Stale Management

on:
  schedule:
    - cron: '0 2 * * 1' # Run weekly on Mondays at 2 AM UTC
  workflow_dispatch: # Allow manual triggering
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  intelligent-stale-analysis:
    name: Intelligent Stale Analysis
    runs-on: ubuntu-latest
    outputs:
      stale-candidates: ${{ steps.analysis.outputs.stale-candidates }}
      metrics: ${{ steps.analysis.outputs.metrics }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Intelligent Stale Analysis
        id: analysis
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isDryRun = context.payload.inputs?.dry_run === 'true';
            
            // Configuration for different priority levels
            const staleConfig = {
              'P0-Critical': { daysBefore: 90, exempt: true },  // Critical issues never go stale
              'P1-High': { daysBefore: 75, exempt: false },     // High priority gets longer time
              'P2-Medium': { daysBefore: 45, exempt: false },   // Standard time
              'P3-Low': { daysBefore: 30, exempt: false },      // Low priority shorter time
              'default': { daysBefore: 45, exempt: false }      // Default for unlabeled
            };
            
            // Get all open issues and PRs
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            
            let staleCandidate = [];
            let metrics = {
              totalAnalyzed: 0,
              exemptedByPriority: 0,
              exemptedByActivity: 0,
              markedStale: 0,
              errors: 0
            };
            
            const now = new Date();
            
            for (const issue of issues.data) {
              metrics.totalAnalyzed++;
              
              try {
                // Determine priority level
                const labels = issue.labels.map(l => l.name);
                let priority = 'default';
                for (const label of labels) {
                  if (staleConfig[label]) {
                    priority = label;
                    break;
                  }
                }
                
                const config = staleConfig[priority];
                
                // Check if exempt by priority
                if (config.exempt) {
                  metrics.exemptedByPriority++;
                  continue;
                }
                
                // Check if exempt by labels
                const exemptLabels = ['keep-open', 'security', 'pinned', 'work-in-progress'];
                if (labels.some(label => exemptLabels.includes(label))) {
                  metrics.exemptedByPriority++;
                  continue;
                }
                
                // Check last activity
                const lastActivity = new Date(Math.max(
                  new Date(issue.updated_at),
                  new Date(issue.created_at)
                ));
                
                const daysSinceActivity = Math.floor((now - lastActivity) / (1000 * 60 * 60 * 24));
                
                // Analyze community engagement
                const reactions = issue.reactions.total_count || 0;
                const comments = issue.comments || 0;
                
                // Enhanced analysis for feature requests and high-engagement items
                const isFeatureRequest = labels.includes('type/feature') || 
                                       labels.includes('enhancement') ||
                                       issue.title.toLowerCase().includes('feature');
                
                const hasHighEngagement = reactions >= 5 || comments >= 10;
                
                // Adjust stale period based on engagement
                let adjustedDaysBefore = config.daysBefore;
                if (isFeatureRequest && hasHighEngagement) {
                  adjustedDaysBefore *= 1.5; // 50% longer for engaged feature requests
                  metrics.exemptedByActivity++;
                  continue;
                }
                
                if (daysSinceActivity >= adjustedDaysBefore) {
                  staleCandidate.push({
                    number: issue.number,
                    title: issue.title,
                    type: issue.pull_request ? 'pr' : 'issue',
                    priority: priority,
                    daysSinceActivity: daysSinceActivity,
                    engagement: { reactions, comments },
                    url: issue.html_url
                  });
                  
                  if (!isDryRun) {
                    metrics.markedStale++;
                  }
                }
              } catch (error) {
                console.error(`Error analyzing ${issue.number}: ${error.message}`);
                metrics.errors++;
              }
            }
            
            console.log(`Analysis complete. Found ${staleCandidate.length} stale candidates.`);
            console.log(`Metrics:`, JSON.stringify(metrics, null, 2));
            
            core.setOutput('stale-candidates', JSON.stringify(staleCandidate));
            core.setOutput('metrics', JSON.stringify(metrics));
            
            return {
              staleCandidates: staleCandidate.length,
              metrics: metrics
            };

  apply-stale-actions:
    name: Apply Stale Actions
    needs: intelligent-stale-analysis
    if: needs.intelligent-stale-analysis.outputs.stale-candidates != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Apply Intelligent Stale Labels
        uses: actions/github-script@v7
        with:
          script: |
            const candidates = JSON.parse('${{ needs.intelligent-stale-analysis.outputs.stale-candidates }}');
            const isDryRun = context.payload.inputs?.dry_run === 'true';
            const { owner, repo } = context.repo;
            
            console.log(`Processing ${candidates.length} stale candidates. Dry run: ${isDryRun}`);
            
            for (const candidate of candidates) {
              try {
                const staleMessage = candidate.type === 'pr' ? 
                  `🤖 **Intelligent Stale Detection**: This ${candidate.type} has been inactive for ${candidate.daysSinceActivity} days (Priority: ${candidate.priority}).
                  
                  📊 **Engagement**: ${candidate.engagement.reactions} reactions, ${candidate.engagement.comments} comments
                  
                  🛠️ **To keep this active:**
                  - Add a comment with updates
                  - Push new commits (for PRs)
                  - Add the \`keep-open\` label
                  - Ensure appropriate priority labeling
                  
                  This intelligent system considers priority levels and community engagement in stale detection.` :
                  `🤖 **Intelligent Stale Detection**: This ${candidate.type} has been inactive for ${candidate.daysSinceActivity} days (Priority: ${candidate.priority}).
                  
                  📊 **Engagement**: ${candidate.engagement.reactions} reactions, ${candidate.engagement.comments} comments
                  
                  📝 **To keep this open:**
                  - Add a comment with updates
                  - Add the \`keep-open\` label
                  - Ensure appropriate priority labeling
                  
                  This intelligent system considers priority levels and community engagement in stale detection.`;
                
                if (!isDryRun) {
                  // Add stale label
                  await github.rest.issues.addLabels({
                    owner, repo,
                    issue_number: candidate.number,
                    labels: ['status/stale']
                  });
                  
                  // Add intelligent stale comment
                  await github.rest.issues.createComment({
                    owner, repo,
                    issue_number: candidate.number,
                    body: staleMessage
                  });
                  
                  console.log(`Marked ${candidate.type} #${candidate.number} as stale`);
                } else {
                  console.log(`[DRY RUN] Would mark ${candidate.type} #${candidate.number} as stale`);
                }
                
                // Add small delay to avoid rate limiting
                await new Promise(resolve => setTimeout(resolve, 1000));
                
              } catch (error) {
                console.error(`Error processing ${candidate.type} #${candidate.number}: ${error.message}`);
              }
            }

  generate-stale-report:
    name: Generate Stale Management Report
    needs: [intelligent-stale-analysis, apply-stale-actions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Generate Report
        uses: actions/github-script@v7
        with:
          script: |
            const metrics = JSON.parse('${{ needs.intelligent-stale-analysis.outputs.metrics }}');
            const candidates = JSON.parse('${{ needs.intelligent-stale-analysis.outputs.stale-candidates }}');
            const isDryRun = context.payload.inputs?.dry_run === 'true';
            
            const report = `# 📊 Intelligent Stale Management Report
            
            **Run Date**: ${new Date().toISOString()}
            **Mode**: ${isDryRun ? 'Dry Run' : 'Production'}
            
            ## Summary Metrics
            - **Total Items Analyzed**: ${metrics.totalAnalyzed}
            - **Exempted by Priority**: ${metrics.exemptedByPriority}
            - **Exempted by Activity**: ${metrics.exemptedByActivity}
            - **Stale Candidates Found**: ${candidates.length}
            - **Actions Applied**: ${isDryRun ? 0 : metrics.markedStale}
            - **Errors Encountered**: ${metrics.errors}
            
            ## Stale Candidates by Priority
            ${candidates.reduce((acc, c) => {
              acc[c.priority] = (acc[c.priority] || 0) + 1;
              return acc;
            }, {})}
            
            ## Configuration Applied
            - **P0-Critical**: Never stale (exempt)
            - **P1-High**: 75 days before stale
            - **P2-Medium**: 45 days before stale  
            - **P3-Low**: 30 days before stale
            - **Feature Requests**: +50% time if highly engaged
            
            ${candidates.length > 0 ? '## Items Processed\n' + candidates.map(c => 
              `- [${c.type.toUpperCase()} #${c.number}](${c.url}): ${c.title} (${c.daysSinceActivity}d inactive, ${c.priority})`
            ).join('\n') : '## No stale candidates found'}
            
            ---
            *Generated by Intelligent Stale Management System*`;
            
            console.log(report);
            
            // Optional: Create an issue with the report (uncomment if desired)
            // await github.rest.issues.create({
            //   owner: context.repo.owner,
            //   repo: context.repo.repo,
            //   title: `Stale Management Report - ${new Date().toISOString().split('T')[0]}`,
            //   body: report,
            //   labels: ['automation', 'stale-report']
            // });