name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@b1ae948fdca0c35d8ec8fa0e432cb85cf1543b8b # v5.1.1
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    secrets: inherit  # pragma: allowlist secret
    with:
      codeql: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
