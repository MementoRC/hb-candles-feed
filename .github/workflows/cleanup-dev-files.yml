---
name: Cleanup Development Artifacts

# Disabled: requires CI_BOT_TOKEN, CI_BOT_GPG_KEY, CI_BOT_GPG_KEY_ID secrets
# Re-enable when bot secrets are configured in repository settings
# on:
#   push:
#     branches: [main, development]
#   schedule:
#     - cron: '0 2 * * *'
#   workflow_dispatch:
#     inputs:
#       target_branch:
#         description: 'Branch to clean'
#         required: false
#         default: 'development'
#         type: choice
#         options:
#           - main
#           - development

on:
  workflow_dispatch:
    inputs:
      placeholder:
        description: 'Disabled until bot secrets are configured'
        required: false
        default: 'disabled'

jobs:
  cleanup:
    if: false
    uses: Claire-s-Monster/ci-framework/.github/workflows/cleanup-dev-files.yml@dd7b8424ba3869283fab81f60aaec75cdac3168e
    with:
      target_branches: >-
        ${{
          github.event_name == 'push'
          && format('["{0}"]', github.ref_name)
          || github.event_name == 'workflow_dispatch'
          && format('["{0}"]', github.event.inputs.target_branch)
          || '["main", "development"]'
        }}
      cleanup_patterns: >
        ["CLAUDE.md", "GEMINI.md", ".claude/**", ".taskmaster/**", ".mcp.json", "ai_docs/**",
        ".cursor/**", ".aider*", "**/__pycache__/**", "**/*.pyc", ".pytest_cache/**",
        "htmlcov/**", "coverage.xml", ".mypy_cache/**", ".ruff_cache/**", "build/**",
        "dist/**", "**/*.egg-info/**",
        ".vscode/settings.json", ".idea/**", "*.code-workspace",
        "*.tmp", "*.dev", ".DS_Store", "Thumbs.db"]
      workflow_name: 'hb-candles-feed Cleanup'
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
