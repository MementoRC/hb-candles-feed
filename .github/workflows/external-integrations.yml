name: External Tool Integrations

on:
  schedule:
    # Run Hummingbot compatibility checks daily
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      integration_type:
        description: 'Type of integration to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - hummingbot
          - monitoring
          - notifications
          - code-quality
      hummingbot_version:
        description: 'Specific Hummingbot version to test against'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # Enhanced Hummingbot Integration Testing
  hummingbot-compatibility:
    name: Hummingbot Compatibility Test
    runs-on: ubuntu-latest
    if: github.event.inputs.integration_type == 'all' || github.event.inputs.integration_type == 'hummingbot' || github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        include:
          - hummingbot-version: "1.25.0"
            python-version: "3.10"
          - hummingbot-version: "1.26.0" 
            python-version: "3.10"
          - hummingbot-version: "development"
            python-version: "3.10"
          - hummingbot-version: "latest"
            python-version: "3.11"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hummingbot ${{ matrix.hummingbot-version }}
        run: |
          # Install specific Hummingbot version for testing
          if [ "${{ matrix.hummingbot-version }}" = "latest" ]; then
            pip install hummingbot
          elif [ "${{ matrix.hummingbot-version }}" = "development" ]; then
            pip install git+https://github.com/hummingbot/hummingbot.git@development
          else
            pip install hummingbot==${{ matrix.hummingbot-version }}
          fi

      - name: Install Candles Feed Package
        run: |
          pip install -e .
          pip install pytest pytest-asyncio aioresponses

      - name: Run Hummingbot Integration Tests
        run: |
          # Run specific Hummingbot integration tests
          pytest tests/unit/test_hummingbot_integration.py -v
          pytest tests/integration/test_service_container_integration.py -v

      - name: Test Hummingbot Component Compatibility
        run: |
          python -c "
          import sys
          try:
              from candles_feed import create_candles_feed_with_hummingbot
              from candles_feed.mocking_resources.hummingbot.mock_components import create_mock_hummingbot_components
              
              # Test component creation
              throttler, web_factory = create_mock_hummingbot_components()
              
              # Test candles feed creation
              feed = create_candles_feed_with_hummingbot(
                  exchange='binance_spot',
                  trading_pair='BTC-USDT',
                  throttler=throttler,
                  web_assistants_factory=web_factory
              )
              
              print('✅ Hummingbot compatibility test passed')
          except Exception as e:
              print(f'❌ Hummingbot compatibility test failed: {e}')
              sys.exit(1)
          "

      - name: Create Compatibility Report
        if: always()
        run: |
          echo "# Hummingbot Compatibility Report" > compatibility-report.md
          echo "**Hummingbot Version:** ${{ matrix.hummingbot-version }}" >> compatibility-report.md
          echo "**Python Version:** ${{ matrix.python-version }}" >> compatibility-report.md
          echo "**Test Status:** ${{ job.status }}" >> compatibility-report.md
          echo "**Test Date:** $(date -u)" >> compatibility-report.md

      - name: Upload Compatibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummingbot-compatibility-${{ matrix.hummingbot-version }}-py${{ matrix.python-version }}
          path: compatibility-report.md

  # External Monitoring Integration Test
  monitoring-integration:
    name: Monitoring Systems Integration
    runs-on: ubuntu-latest
    if: github.event.inputs.integration_type == 'all' || github.event.inputs.integration_type == 'monitoring'

    services:
      prometheus:
        image: prom/prometheus:latest
        ports:
          - 9090:9090
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:9090/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio aiohttp aioresponses

      - name: Test Prometheus Metrics Export
        run: |
          # Start metrics exporter in background
          python -c "
          import asyncio
          import sys
          from candles_feed.core.monitoring import MonitoringManager, MonitoringConfig
          from candles_feed.integration.monitoring import (
              ExternalMonitoringIntegration, 
              MonitoringIntegrationConfig
          )
          
          async def test_prometheus():
              monitoring_config = MonitoringConfig(enable_metrics_collection=True)
              monitoring_manager = MonitoringManager(monitoring_config)
              
              integration_config = MonitoringIntegrationConfig(
                  prometheus_enabled=True,
                  prometheus_port=9091  # Use different port to avoid conflicts
              )
              
              integration = ExternalMonitoringIntegration(
                  monitoring_manager, integration_config
              )
              
              try:
                  await integration.start()
                  
                  # Simulate some metrics
                  monitoring_manager.update_metrics({
                      'test_metric_1': 42,
                      'test_metric_2': 3.14
                  })
                  
                  # Wait a bit for server to start
                  await asyncio.sleep(2)
                  
                  # Test metrics endpoint
                  import aiohttp
                  async with aiohttp.ClientSession() as session:
                      async with session.get('http://localhost:9091/metrics') as response:
                          if response.status == 200:
                              metrics_text = await response.text()
                              if 'candles_feed_test_metric_1 42' in metrics_text:
                                  print('✅ Prometheus metrics export test passed')
                              else:
                                  print('❌ Metrics content validation failed')
                                  sys.exit(1)
                          else:
                              print(f'❌ Metrics endpoint returned {response.status}')
                              sys.exit(1)
                              
              except Exception as e:
                  print(f'❌ Prometheus integration test failed: {e}')
                  sys.exit(1)
              finally:
                  await integration.stop()
          
          asyncio.run(test_prometheus())
          "

      - name: Test Health Check Endpoints
        run: |
          python -c "
          import asyncio
          import sys
          from candles_feed.core.monitoring import MonitoringManager, MonitoringConfig
          from candles_feed.integration.monitoring import (
              ExternalMonitoringIntegration,
              MonitoringIntegrationConfig
          )
          
          async def test_health_checks():
              monitoring_config = MonitoringConfig()
              monitoring_manager = MonitoringManager(monitoring_config)
              
              integration_config = MonitoringIntegrationConfig(
                  health_check_enabled=True,
                  health_check_port=8082
              )
              
              integration = ExternalMonitoringIntegration(
                  monitoring_manager, integration_config
              )
              
              try:
                  await integration.start()
                  await asyncio.sleep(2)  # Wait for server to start
                  
                  import aiohttp
                  async with aiohttp.ClientSession() as session:
                      # Test health endpoint
                      async with session.get('http://localhost:8082/health') as response:
                          if response.status != 200:
                              print(f'❌ Health endpoint returned {response.status}')
                              sys.exit(1)
                      
                      # Test readiness endpoint
                      async with session.get('http://localhost:8082/health/readiness') as response:
                          if response.status not in [200, 503]:  # Either ready or not ready is fine
                              print(f'❌ Readiness endpoint returned {response.status}')
                              sys.exit(1)
                      
                      # Test liveness endpoint
                      async with session.get('http://localhost:8082/health/liveness') as response:
                          if response.status != 200:
                              print(f'❌ Liveness endpoint returned {response.status}')
                              sys.exit(1)
                  
                  print('✅ Health check endpoints test passed')
                              
              except Exception as e:
                  print(f'❌ Health check integration test failed: {e}')
                  sys.exit(1)
              finally:
                  await integration.stop()
          
          asyncio.run(test_health_checks())
          "

  # Notification Integration Test
  notification-integration:
    name: Notification Systems Integration
    runs-on: ubuntu-latest
    if: github.event.inputs.integration_type == 'all' || github.event.inputs.integration_type == 'notifications'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio aiohttp aioresponses

      - name: Test Notification Providers
        run: |
          python -c "
          import asyncio
          import sys
          from candles_feed.core.notifications import (
              NotificationManager, NotificationConfig, NotificationMessage, 
              NotificationLevel, NotificationChannel
          )
          
          async def test_notifications():
              # Test with webhook configuration (mock endpoint)
              config = NotificationConfig(
                  channels={
                      NotificationChannel.WEBHOOK: {
                          'url': 'https://httpbin.org/post',
                          'headers': {'Content-Type': 'application/json'}
                      }
                  }
              )
              
              manager = NotificationManager(config)
              
              message = NotificationMessage(
                  title='Test Notification',
                  content='This is a test message from CI',
                  level=NotificationLevel.INFO,
                  channel=NotificationChannel.WEBHOOK,
                  metadata={'test': True, 'ci_run': True}
              )
              
              try:
                  success = await manager.send_notification(message)
                  if success:
                      print('✅ Webhook notification test passed')
                  else:
                      print('❌ Webhook notification test failed')
                      sys.exit(1)
              except Exception as e:
                  print(f'❌ Notification test failed: {e}')
                  sys.exit(1)
          
          asyncio.run(test_notifications())
          "

      - name: Test Build Status Notifications
        run: |
          python -c "
          import asyncio
          from candles_feed.core.notifications import NotificationManager, NotificationConfig, NotificationChannel
          
          async def test_build_notifications():
              config = NotificationConfig(
                  channels={
                      NotificationChannel.WEBHOOK: {
                          'url': 'https://httpbin.org/post'
                      }
                  }
              )
              
              manager = NotificationManager(config)
              
              # Test build status notification
              success = await manager.send_build_status(
                  status='success',
                  branch='feature/external-integrations',
                  commit_sha='abc123def456',
                  workflow_name='External Tool Integrations',
                  details={
                      'duration': '2m 30s',
                      'test_results': 'All tests passed'
                  }
              )
              
              if success:
                  print('✅ Build status notification test passed')
              else:
                  print('❌ Build status notification test failed')
          
          asyncio.run(test_build_notifications())
          "

  # Code Quality Tool Integration
  code-quality-integration:
    name: Code Quality Tools Integration
    runs-on: ubuntu-latest
    if: github.event.inputs.integration_type == 'all' || github.event.inputs.integration_type == 'code-quality'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies and Run Tests with Coverage
        run: |
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio aioresponses
          
          # Run tests with coverage for code quality analysis
          pytest --cov=candles_feed --cov-report=xml --cov-report=lcov tests/

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: external-integrations
          name: external-integrations-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Quality Gate Check
        run: |
          # Check if coverage meets minimum threshold
          python -c "
          import xml.etree.ElementTree as ET
          
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              coverage = float(root.attrib['line-rate']) * 100
              
              print(f'Code coverage: {coverage:.1f}%')
              
              if coverage < 80:
                  print('❌ Code coverage below 80% threshold')
                  exit(1)
              else:
                  print('✅ Code coverage meets quality standards')
          except Exception as e:
              print(f'Warning: Could not parse coverage report: {e}')
          "

  # Integration Summary and Notification
  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [hummingbot-compatibility, monitoring-integration, notification-integration, code-quality-integration]
    if: always()

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Integration Report
        run: |
          echo "# External Tool Integration Report" > integration-report.md
          echo "**Date:** $(date -u)" >> integration-report.md
          echo "**Workflow:** ${{ github.workflow }}" >> integration-report.md
          echo "**Trigger:** ${{ github.event_name }}" >> integration-report.md
          echo "" >> integration-report.md
          
          echo "## Integration Test Results" >> integration-report.md
          echo "- **Hummingbot Compatibility:** ${{ needs.hummingbot-compatibility.result }}" >> integration-report.md
          echo "- **Monitoring Integration:** ${{ needs.monitoring-integration.result }}" >> integration-report.md
          echo "- **Notification Integration:** ${{ needs.notification-integration.result }}" >> integration-report.md
          echo "- **Code Quality Integration:** ${{ needs.code-quality-integration.result }}" >> integration-report.md
          echo "" >> integration-report.md
          
          # Determine overall status
          if [[ "${{ needs.hummingbot-compatibility.result }}" == "success" && \
                "${{ needs.monitoring-integration.result }}" == "success" && \
                "${{ needs.notification-integration.result }}" == "success" && \
                "${{ needs.code-quality-integration.result }}" == "success" ]]; then
            echo "**Overall Status:** ✅ All integrations successful" >> integration-report.md
            echo "OVERALL_STATUS=success" >> $GITHUB_ENV
          else
            echo "**Overall Status:** ❌ Some integrations failed" >> integration-report.md
            echo "OVERALL_STATUS=failure" >> $GITHUB_ENV
          fi

      - name: Create Issue on Integration Failure
        if: env.OVERALL_STATUS == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('integration-report.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 External Tool Integration Failure',
              body: `${reportContent}\n\n**Action Required:** Please investigate and fix the failing integrations.`,
              labels: ['external-integration', 'needs-investigation', 'automated']
            });

      - name: Upload Integration Report
        uses: actions/upload-artifact@v4
        with:
          name: external-integration-report
          path: integration-report.md

      - name: Send Notification (if configured)
        if: always()
        run: |
          # This would integrate with the notification system if webhook URLs are configured
          echo "Integration workflow completed with status: ${{ env.OVERALL_STATUS }}"
          echo "Report uploaded as artifact: external-integration-report"