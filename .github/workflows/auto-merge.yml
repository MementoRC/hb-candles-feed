name: Auto-Merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["Enhanced Package CI", "Security Scanning"] # Trigger on completion of key workflows
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read # To read check suites/runs status

jobs:
  auto-merge-dependabot:
    name: Auto-Merge Dependabot PR
    if: >
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout PR metadata (for workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4 # Minimal checkout for PR info
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false
          depth: 1

      - name: Auto-merge Dependabot PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const GITHUB_CONTEXT = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            // =================================================================================
            // === CONFIGURATION: Define rules for auto-merging ================================
            // =================================================================================
            const CONFIG = {
              // 1. Dependency Intelligence & Classification
              dependencyCategories: {
                // Critical runtime dependencies - require manual approval for minor/major updates
                'pydantic': 'critical-runtime', 'pandas': 'critical-runtime', 'numpy': 'critical-runtime',
                // Standard runtime dependencies - can be auto-merged on patch/minor
                'aiohttp': 'runtime', 'ccxt': 'runtime',
                // Build tools - low risk, can be auto-merged
                'hatchling': 'build-tool', 'cython': 'build-tool', 'wheel': 'build-tool',
                // Dev/test tools - low risk, can be auto-merged
                'pytest': 'dev-tool', 'ruff': 'dev-tool', 'mypy': 'dev-tool', 'pre-commit': 'dev-tool',
                'pytest-cov': 'dev-tool', 'locust': 'dev-tool', 'mkdocs': 'dev-tool',
                'default': 'runtime' // Default category for unlisted packages
              },

              // 2. Enhanced Approval Workflow Rules (number of approvals needed)
              approvalRules: {
                'critical-runtime': { major: 1, minor: 1, patch: 0, security: 0 },
                'runtime':          { major: 1, minor: 0, patch: 0, security: 0 },
                'build-tool':       { major: 1, minor: 0, patch: 0, security: 0 },
                'dev-tool':         { major: 1, minor: 0, patch: 0, security: 0 },
              },

              // 5. Time-Based Safety Windows (in hours)
              timeDelays: {
                'critical-runtime': 24, // 24-hour "soak" time for critical dependencies
                'runtime': 2,
                'build-tool': 0,
                'dev-tool': 0,
              },

              // 3. Advanced Version Analysis - Package-specific overrides
              specialRules: {
                'ruff': { autoMergeOnMinor: true } // Example: ruff minor updates are considered safe
              },

              // Teams to notify for required reviews
              reviewers: {
                'critical-runtime': ['MementoRC'], // Tag specific users/teams
                'default': ['MementoRC']
              },

              // 4. Quality Gates Integration
              requiredWorkflows: ["Enhanced Package CI", "Security Scanning"]
            };

            // =================================================================================
            // === HELPER FUNCTIONS ============================================================
            // =================================================================================

            /**
             * Parses PR title to extract dependency information.
             */
            function getDependencyInfo(pr) {
              const title = pr.title;
              const body = pr.body || '';
              const versionRegex = /bump(?:s)?\s+`?([^\s`]+)`?\s+from\s+v?([\d\w.-]+)\s+to\s+v?([\d\w.-]+)/i;
              const match = title.match(versionRegex);

              if (!match) {
                console.log(`Could not parse dependency info from title: "${title}"`);
                return null;
              }

              const [_, name, from, to] = match;
              const category = CONFIG.dependencyCategories[name] || CONFIG.dependencyCategories['default'];
              const isSecurityUpdate = body.includes('dependabot-security-alert') || pr.labels.some(l => l.name === 'security');

              const getImpact = (from, to) => {
                const fromParts = from.split('.').map(p => parseInt(p.replace(/\D/g, '')));
                const toParts = to.split('.').map(p => parseInt(p.replace(/\D/g, '')));
                if (toParts[0] > fromParts[0]) return 'major';
                if (toParts.length > 1 && fromParts.length > 1 && toParts[1] > fromParts[1]) return 'minor';
                return 'patch';
              };

              return { name, from, to, category, isSecurityUpdate, impact: getImpact(from, to) };
            }

            /**
             * Checks the status of all required quality gate workflows.
             */
            async function checkQualityGates(pr) {
              const { data: response } = await github.rest.checks.listForRef({
                ...GITHUB_CONTEXT, ref: pr.head.sha,
              });

              let status = { passed: true, pending: false, summary: [] };
              for (const workflowName of CONFIG.requiredWorkflows) {
                const suite = response.check_suites.find(s => s.app.name === 'GitHub Actions' && s.name === workflowName);
                if (!suite) {
                  status.passed = false;
                  status.summary.push(`❓ ${workflowName}: Not found.`);
                  continue;
                }
                if (suite.status !== 'completed') {
                  status.pending = true;
                  status.summary.push(`⏳ ${workflowName}: In progress.`);
                } else if (suite.conclusion !== 'success' && suite.conclusion !== 'skipped') {
                  status.passed = false;
                  status.summary.push(`❌ ${workflowName}: ${suite.conclusion}.`);
                } else {
                  status.summary.push(`✅ ${workflowName}: ${suite.conclusion}.`);
                }
              }
              // Future integration points for advanced quality gates
              status.summary.push('ℹ️ Performance/Coverage Gate: Not implemented. Relies on workflow success.');
              return status;
            }

            /**
             * Posts a consolidated status comment on the PR.
             */
            async function postStatusComment(prNumber, message) {
              const header = "### 🤖 Auto-Merge Status";
              const { data: comments } = await github.rest.issues.listComments({
                ...GITHUB_CONTEXT, issue_number: prNumber,
              });
              const existingComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith(header));

              const body = `${header}\n\n${message}`;

              if (existingComment) {
                await github.rest.issues.updateComment({
                  ...GITHUB_CONTEXT, comment_id: existingComment.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...GITHUB_CONTEXT, issue_number: prNumber, body,
                });
              }
            }

            // =================================================================================
            // === MAIN PROCESSING LOGIC =======================================================
            // =================================================================================

            async function processPullRequest(prNumber) {
              console.log(`Processing PR #${prNumber}`);
              const { data: pr } = await github.rest.pulls.get({
                ...GITHUB_CONTEXT, pull_number: prNumber,
              });

              // --- Initial Safety Checks ---
              if (pr.user.login !== 'dependabot[bot]') return console.log(`Not a Dependabot PR.`);
              if (pr.state !== 'open' || pr.draft) return console.log(`PR is not open or is a draft.`);
              if (!pr.labels.some(l => l.name === 'dependencies')) return console.log(`PR lacks 'dependencies' label.`);

              // --- 1. Dependency Intelligence & Analysis ---
              const dep = getDependencyInfo(pr);
              if (!dep) return postStatusComment(prNumber, "⚠️ Could not parse dependency information from PR title.");

              let statusMessage = `**Dependency:** \`${dep.name}\` (\`${dep.category}\`)\n`;
              statusMessage += `**Update:** \`${dep.from}\` → \`${dep.to}\` (\`${dep.impact}\`)\n`;
              statusMessage += `**Security Update:** ${dep.isSecurityUpdate ? 'Yes' : 'No'}\n\n`;

              // --- 4. Quality Gates Integration ---
              const qualityGates = await checkQualityGates(pr);
              statusMessage += `**Quality Gates:**\n${qualityGates.summary.map(s => `- ${s}`).join('\n')}\n\n`;
              if (qualityGates.pending) return postStatusComment(prNumber, statusMessage + "⏳ CI checks are in progress. Will re-evaluate upon completion.");
              if (!qualityGates.passed) return postStatusComment(prNumber, statusMessage + "❌ Not all quality gates passed. Manual review required.");

              // --- 2. Enhanced Approval Workflow ---
              const rules = CONFIG.approvalRules[dep.category] || {};
              let requiredApprovals = rules[dep.impact] ?? 1; // Default to 1 approval if impact unknown
              if (dep.isSecurityUpdate) requiredApprovals = rules.security ?? 0;
              if (CONFIG.specialRules[dep.name]?.autoMergeOnMinor && dep.impact === 'minor') requiredApprovals = 0;

              const { data: reviews } = await github.rest.pulls.listReviews({ ...GITHUB_CONTEXT, pull_number: prNumber });
              const approvedCount = reviews.filter(r => r.state === 'APPROVED').length;

              statusMessage += `**Approval Status:**\n- Required: ${requiredApprovals}\n- Current: ${approvedCount}\n\n`;
              if (approvedCount < requiredApprovals) {
                const reviewers = (CONFIG.reviewers[dep.category] || CONFIG.reviewers.default).join(' ');
                return postStatusComment(prNumber, statusMessage + `👋 Needs ${requiredApprovals - approvedCount} more approval(s). Pinging ${reviewers} for review.`);
              }

              // --- 5. Time-Based Safety Windows ---
              const delayHours = CONFIG.timeDelays[dep.category] ?? 0;
              const hasBypassLabel = pr.labels.some(l => l.name === 'auto-merge-bypass-delay');
              if (delayHours > 0 && !dep.isSecurityUpdate && !hasBypassLabel) {
                const prCreatedAt = new Date(pr.created_at);
                const requiredTime = new Date(prCreatedAt.getTime() + delayHours * 3600 * 1000);
                if (new Date() < requiredTime) {
                  const remaining = ((requiredTime - new Date()) / 3600 / 1000).toFixed(1);
                  return postStatusComment(prNumber, statusMessage + `⏳ Waiting for ${delayHours}h soak period to complete. ~${remaining}h remaining.`);
                }
              }

              // --- Final Mergeability Check ---
              if (!pr.mergeable) {
                return postStatusComment(prNumber, statusMessage + `❌ PR is not mergeable (State: \`${pr.mergeable_state}\`). Manual intervention needed.`);
              }

              // --- Merge Action ---
              try {
                console.log(`Attempting to merge PR #${prNumber}`);
                await github.rest.pulls.merge({
                  ...GITHUB_CONTEXT,
                  pull_number: prNumber,
                  commit_title: `Auto-merge Dependabot PR #${prNumber}: ${pr.title}`,
                  commit_message: `Auto-merged by GitHub Actions after passing all quality gates and approval policies.`,
                  merge_method: 'squash',
                });
                console.log(`PR #${prNumber} merged successfully.`);
                await postStatusComment(prNumber, statusMessage + "✅ This PR has been automatically merged after passing all checks.");
              } catch (error) {
                console.error(`Failed to merge PR #${prNumber}:`, error);
                await postStatusComment(prNumber, statusMessage + `🚨 Auto-merge failed: ${error.message}`);
              }
            }

            // =================================================================================
            // === WORKFLOW TRIGGER HANDLING ===================================================
            // =================================================================================
            if (github.event_name == 'pull_request_target') {
              await processPullRequest(context.issue.number);
            } else if (github.event_name == 'workflow_run') {
              const associatedPRs = github.event.workflow_run.pull_requests;
              if (associatedPRs && associatedPRs.length > 0) {
                for (const pr of associatedPRs) {
                  await processPullRequest(pr.number);
                }
              } else {
                console.log("Workflow run not associated with any PRs. Skipping.");
              }
            }
