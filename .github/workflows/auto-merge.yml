name: Auto-Merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_run:
    workflows: ["Enhanced Package CI"] # Name of your CI workflow from ci.yml
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read # To read check suites/runs status

jobs:
  auto-merge-dependabot:
    name: Auto-Merge Dependabot PR
    if: >
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Checkout PR metadata (for workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4 # Minimal checkout for PR info
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false
          depth: 1

      - name: Auto-merge Dependabot PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const GITHUB_CONTEXT = {
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            async function processPullRequest(prNumber) {
              console.log(`Processing PR #${prNumber}`);
              const { data: pr } = await github.rest.pulls.get({
                ...GITHUB_CONTEXT,
                pull_number: prNumber,
              });

              if (pr.user.login !== 'dependabot[bot]') {
                console.log(`PR #${prNumber} is not from Dependabot. Skipping.`);
                return;
              }

              if (pr.state !== 'open') {
                console.log(`PR #${prNumber} is not open. Skipping.`);
                return;
              }

              if (pr.draft) {
                console.log(`PR #${prNumber} is a draft. Skipping.`);
                return;
              }

              // Major version update safeguard: Parse PR title
              const title = pr.title;
              const versionRegex = /bump(?:s)?\s+.+?\s+from\s+v?([\d\w.-]+)\s+to\s+v?([\d\w.-]+)/i;
              const versionMatch = title.match(versionRegex);

              if (versionMatch) {
                const versionFromString = versionMatch[1];
                const versionToString = versionMatch[2];
                console.log(`PR #${prNumber}: Detected versions in title - From: ${versionFromString}, To: ${versionToString}`);

                const majorFrom = parseInt(versionFromString.split('.')[0], 10);
                const majorTo = parseInt(versionToString.split('.')[0], 10);

                if (!isNaN(majorFrom) && !isNaN(majorTo) && majorTo > majorFrom) {
                  console.log(`PR #${prNumber}: Major version update detected (${majorFrom} -> ${majorTo}). Skipping auto-merge.`);
                  await github.rest.issues.createComment({
                    ...GITHUB_CONTEXT,
                    issue_number: prNumber,
                    body: "🤖 Auto-merge skipped: This appears to be a major version update. Please review manually.",
                  });
                  return; // Skip auto-merge for detected major updates
                }
              } else {
                console.log(`PR #${prNumber}: Could not parse version bump from title, or title does not match standard bump format. Proceeding, relying on dependabot.yml update-types and CI. Title: "${title}"`);
              }

              // Check for 'dependencies' label (standard for Dependabot PRs)
              const hasDependencyLabel = pr.labels.some(label => label.name === 'dependencies');
              if (!hasDependencyLabel) {
                console.log(`PR #${prNumber} does not have 'dependencies' label. Skipping auto-merge.`);
                return;
              }

              // Check CI status
              const { data: checkSuitesResponse } = await github.rest.checks.listForRef({
                ...GITHUB_CONTEXT,
                ref: pr.head.sha,
                ref: pr.head.sha,
              });

              const relevantCheckSuites = checkSuitesResponse.check_suites;

              const isAnyCheckPending = relevantCheckSuites.some(suite => suite.status !== 'completed');
              if (isAnyCheckPending) {
                console.log(`PR #${prNumber}: CI checks are still pending. Will re-evaluate when workflow_run completes or on next event.`);
                return;
              }

              // If not pending, all checks must be success or skipped.
              // Also ensure there was at least one check suite.
              const allChecksSuccessfullyCompleted = relevantCheckSuites.length > 0 && relevantCheckSuites.every(
                suite => suite.conclusion === 'success' || suite.conclusion === 'skipped'
              );

              if (!allChecksSuccessfullyCompleted) {
                const checkConclusions = relevantCheckSuites.map(s => `${s.app.name || 'UnknownApp'}(${s.id}): ${s.conclusion}`).join(', ');
                console.log(`PR #${prNumber}: Not all CI checks passed successfully or were skipped. Conclusions: [${checkConclusions}]. Skipping auto-merge.`);
                await github.rest.issues.createComment({
                  ...GITHUB_CONTEXT,
                  issue_number: prNumber,
                  body: `🤖 Auto-merge skipped: Not all CI checks passed successfully. Please review. Conclusions: \`${checkConclusions || 'No conclusions found'}\``,
                });
                return;
              }

              // Safety check: if no check suites were found (and not pending), it might mean CI didn't run.
              // This is covered by relevantCheckSuites.length > 0 in allChecksSuccessfullyCompleted,
              // but an explicit log can be useful if that part of the condition fails.
              if (relevantCheckSuites.length === 0) {
                 console.log(`PR #${prNumber}: No completed check suites found for ref ${pr.head.sha}. Skipping auto-merge for safety.`);
                 // This case should be caught by !allChecksSuccessfullyCompleted due to .length > 0,
                 // but if it were to be handled separately:
                 // await github.rest.issues.createComment({
                 //   ...GITHUB_CONTEXT,
                 //   issue_number: prNumber,
                 //   body: "🤖 Auto-merge skipped: No CI checks found for this PR's commit.",
                 // });
                 return;
              }

              console.log(`PR #${prNumber}: All CI checks passed successfully or were skipped.`);

              // Check if PR is mergeable
              if (!pr.mergeable) {
                console.log(`PR #${prNumber} is not mergeable. State: ${pr.mergeable_state}. Skipping.`);
                await github.rest.issues.createComment({
                  ...GITHUB_CONTEXT,
                  issue_number: prNumber,
                  body: `🤖 Auto-merge skipped: PR is not mergeable (State: ${pr.mergeable_state}).`,
                });
                return;
              }

              try {
                console.log(`Attempting to merge PR #${prNumber}`);
                await github.rest.pulls.merge({
                  ...GITHUB_CONTEXT,
                  pull_number: prNumber,
                  commit_title: `Auto-merge Dependabot PR #${prNumber}: ${pr.title}`,
                  commit_message: pr.body || `Auto-merged by GitHub Actions.`,
                  merge_method: 'squash', // Or 'merge', 'rebase'
                });
                console.log(`PR #${prNumber} merged successfully.`);
                await github.rest.issues.createComment({
                  ...GITHUB_CONTEXT,
                  issue_number: prNumber,
                  body: "🤖 This Dependabot PR has been automatically merged after passing all CI checks.",
                });
              } catch (error) {
                console.error(`Failed to merge PR #${prNumber}:`, error);
                await github.rest.issues.createComment({
                  ...GITHUB_CONTEXT,
                  issue_number: prNumber,
                  body: `🤖 Auto-merge failed for PR #${prNumber}: ${error.message}`,
                });
              }
            }

            if (github.event_name == 'pull_request_target') {
              await processPullRequest(context.issue.number);
            } else if (github.event_name == 'workflow_run') {
              // Find associated PRs for the commit SHA
              const associatedPRs = github.event.workflow_run.pull_requests;
              if (associatedPRs && associatedPRs.length > 0) {
                for (const pr of associatedPRs) {
                  await processPullRequest(pr.number);
                }
              } else {
                console.log("Workflow run not associated with any PRs. Skipping.");
              }
            }
