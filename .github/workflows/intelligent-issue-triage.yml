name: Intelligent Issue Triage

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage (optional)'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode (no actual changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  issues: write
  contents: read # To read repository content if needed for context in the future

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  intelligent-triage:
    name: Intelligent Issue Triage
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - name: Perform Intelligent Triage
        uses: actions/github-script@v7
        id: triage
        with:
          script: |
            const { owner, repo } = context.repo;
            const issuePayload = context.payload.issue;
            const issueNumber = context.payload.inputs?.issue_number || issuePayload?.number;
            const isDryRun = context.payload.inputs?.dry_run === 'true';

            if (!issueNumber) {
              core.setFailed("Issue number is not available.");
              return;
            }

            // Fetch issue data if triggered by workflow_dispatch and issue_number is provided
            let currentIssue;
            if (context.payload.inputs?.issue_number) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                currentIssue = data;
              } catch (error) {
                core.setFailed(`Failed to fetch issue #${issueNumber}: ${error.message}`);
                return;
              }
            } else {
              currentIssue = issuePayload;
            }

            const issueTitle = currentIssue.title.toLowerCase();
            const issueBody = (currentIssue.body || '').toLowerCase();
            const issueContent = `${issueTitle} ${issueBody}`;
            const currentLabels = currentIssue.labels.map(label => label.name);

            let labelsToAdd = new Set();
            let labelsToRemove = new Set();
            let comments = [];
            let confidenceScores = {}; // { label: score }
            let suggestedAssignees = new Set();

            // --- CONFIGURATION ---
            const priorityMap = {
              'priority/P0-Critical': { keywords: ['critical', 'blocker', 'urgent', 'panic', 'crash', 'regression', 'security breach'], confidence: 95 },
              'priority/P1-High': { keywords: ['high impact', 'severe', 'major bug', 'exploit', 'data loss'], confidence: 85 },
              'priority/P2-Medium': { keywords: ['bug', 'error', 'fail', 'incorrect behavior', 'needs fix', 'performance issue'], confidence: 70 },
              'priority/P3-Low': { keywords: ['minor bug', 'trivial', 'cosmetic', 'typo', 'suggestion', 'enhancement idea'], confidence: 60 }
            };

            const typeMap = {
              'type/bug': { keywords: ['bug', 'error', 'failure', 'defect', 'issue', 'problem', 'exception', 'stacktrace'], confidence: 75 },
              'type/feature': { keywords: ['feature', 'enhancement', 'request', 'proposal', 'idea', 'implement'], confidence: 70 },
              'type/docs': { keywords: ['documentation', 'docs', 'readme', 'guide', 'help file', 'update docs'], confidence: 80 },
              'type/question': { keywords: ['question', 'help', 'how to', 'advice', 'support'], confidence: 70 },
              'type/refactor': { keywords: ['refactor', 'cleanup', 'technical debt', 'optimize code'], confidence: 65 },
              'type/testing': { keywords: ['test', 'testing', 'coverage', 'ci fix'], confidence: 70 }
            };

            const componentMap = {
              'area/core': { keywords: ['candlesfeed', 'baseadapter', 'candledata', 'repositoryinsights'], confidence: 70 },
              'area/adapter': { keywords: ['adapter', 'binance', 'coinbase', 'bybit', 'kraken', 'gate.io', 'okx', 'hyperliquid'], confidence: 75 },
              'area/ci-cd': { keywords: ['workflow', 'github actions', 'ci', 'cd', 'pixi', 'dependabot', 'stale', 'triage action'], confidence: 80 },
              'area/performance': { keywords: ['performance', 'slow', 'benchmark', 'optimize', 'speed', 'memory leak'], confidence: 70 },
              'area/security': { keywords: ['security', 'vulnerability', 'cve', 'exploit', 'auth', 'permission'], confidence: 90 },
              'area/docs': { keywords: ['documentation', 'readme', 'mkdocs', 'guide'], confidence: typeMap['type/docs'].confidence }, // Inherit from type
              'area/tests': { keywords: ['pytest', 'unittest', 'mocking', 'test case'], confidence: typeMap['type/testing'].confidence }
            };

            const expertiseMap = { // For assignee suggestions
              'area/core': ['MementoRC'],
              'area/adapter': ['MementoRC'],
              'area/ci-cd': ['MementoRC'],
              'area/security': ['MementoRC'],
              'default': ['MementoRC']
            };

            // --- LOGIC FUNCTIONS ---
            function calculateConfidenceAndAssign(map, content, existingLabels, singleAssign = false, category = "") {
              let assignedForCategory = singleAssign ? existingLabels.some(l => l.startsWith(category + '/')) : false;
              let bestMatch = { label: null, score: 0 };

              for (const [label, data] of Object.entries(map)) {
                if (singleAssign && assignedForCategory && !labelsToAdd.has(label) && !existingLabels.includes(label)) continue;

                let score = 0;
                data.keywords.forEach(keyword => {
                  if (content.includes(keyword)) {
                    score += data.confidence / data.keywords.length; // Simple weighted score
                    if (keyword.split(" ").length > 1) score += 5; // Bonus for multi-word keywords
                  }
                });

                if (score > 0) {
                  if (singleAssign) {
                    if (score > bestMatch.score) {
                      bestMatch = { label, score };
                    }
                  } else {
                    if (score >= (data.confidence * 0.5)) { // Threshold to add non-exclusive labels
                       if (!existingLabels.includes(label)) labelsToAdd.add(label);
                       confidenceScores[label] = Math.min(100, Math.round(score));
                    }
                  }
                }
              }

              if (singleAssign && bestMatch.label && !existingLabels.includes(bestMatch.label)) {
                // Remove other labels from this category if a new single-assign label is better
                if (assignedForCategory) {
                  existingLabels.forEach(l => {
                    if (l.startsWith(category + '/') && l !== bestMatch.label) labelsToRemove.add(l);
                  });
                  currentLabels.forEach(l => { // Also from current labels if not yet processed
                     if (l.startsWith(category + '/') && l !== bestMatch.label) labelsToRemove.add(l);
                  });
                }
                labelsToAdd.add(bestMatch.label);
                confidenceScores[bestMatch.label] = Math.min(100, Math.round(bestMatch.score));
              }
            }

            // --- TRIAGE EXECUTION ---
            console.log(`Starting triage for issue #${issueNumber}...`);
            console.log(`Current labels: ${currentLabels.join(', ')}`);

            calculateConfidenceAndAssign(priorityMap, issueContent, currentLabels, true, 'priority');
            calculateConfidenceAndAssign(typeMap, issueContent, currentLabels, true, 'type');
            calculateConfidenceAndAssign(componentMap, issueContent, currentLabels, false, 'area');

            // Default 'needs-triage'
            const hasPriority = Array.from(labelsToAdd).some(l => l.startsWith('priority/')) || currentLabels.some(l => l.startsWith('priority/'));
            const hasType = Array.from(labelsToAdd).some(l => l.startsWith('type/')) || currentLabels.some(l => l.startsWith('type/'));

            if (!hasPriority || !hasType) {
              if (!currentLabels.includes('needs-triage') && !labelsToAdd.has('needs-triage')) {
                labelsToAdd.add('needs-triage');
                confidenceScores['needs-triage'] = 50;
                 comments.push("Marked as `needs-triage` due to missing priority or type information.");
              }
            } else {
              if (currentLabels.includes('needs-triage') || labelsToAdd.has('needs-triage')) {
                labelsToRemove.add('needs-triage');
                comments.push("Removed `needs-triage` as priority and type are now assigned.");
              }
            }

            // TaskMaster Integration
            const taskMatch = issueBody.match(/task id[:\s]*(\S+)/i); // More flexible regex
            if (taskMatch) {
              const taskId = taskMatch[1];
              if (!currentLabels.includes('taskmaster-linked')) labelsToAdd.add('taskmaster-linked');
              confidenceScores['taskmaster-linked'] = 90;
              const taskComment = `🔗 Linked to TaskMaster ID: **${taskId}**.`;
              // Avoid duplicate comments for TaskMaster
              const {data: existingComments} = await github.rest.issues.listComments({ owner, repo, issue_number: issueNumber });
              if (!existingComments.some(comment => comment.body.includes(taskId))) {
                comments.push(taskComment);
              }
            }

            // Assignee Suggestions
            let assignedAreas = new Set([...Array.from(labelsToAdd), ...currentLabels].filter(l => l.startsWith('area/')));
            if (assignedAreas.size > 0) {
              assignedAreas.forEach(area => {
                if (expertiseMap[area]) expertiseMap[area].forEach(assignee => suggestedAssignees.add(assignee));
              });
            }
            if (suggestedAssignees.size === 0 && expertiseMap['default']) {
               expertiseMap['default'].forEach(assignee => suggestedAssignees.add(assignee));
            }
            // Remove issue author from suggestions
            if (currentIssue.user) suggestedAssignees.delete(currentIssue.user.login);


            // --- APPLY CHANGES ---
            const finalLabelsToAdd = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l) && !labelsToRemove.has(l));
            const finalLabelsToRemove = Array.from(labelsToRemove).filter(l => currentLabels.includes(l) && !labelsToAdd.has(l));


            if (!isDryRun) {
              if (finalLabelsToAdd.length > 0) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: finalLabelsToAdd });
                console.log(`Added labels: ${finalLabelsToAdd.join(', ')}`);
                finalLabelsToAdd.forEach(l => comments.push(`Added label: \`${l}\` (Confidence: ${confidenceScores[l] || 'N/A'}%)`));
              }
              for (const label of finalLabelsToRemove) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
                  console.log(`Removed label: ${label}`);
                  comments.push(`Removed label: \`${label}\``);
                } catch (error) {
                  if (error.status !== 404) console.error(`Error removing label ${label}: ${error.message}`);
                }
              }
            } else {
              if (finalLabelsToAdd.length > 0) {
                console.log(`[DRY RUN] Would add labels: ${finalLabelsToAdd.join(', ')}`);
                finalLabelsToAdd.forEach(l => comments.push(`[DRY RUN] Would add label: \`${l}\` (Confidence: ${confidenceScores[l] || 'N/A'}%)`));
              }
              if (finalLabelsToRemove.length > 0) {
                console.log(`[DRY RUN] Would remove labels: ${finalLabelsToRemove.join(', ')}`);
                 finalLabelsToRemove.forEach(l => comments.push(`[DRY RUN] Would remove label: \`${l}\``));
              }
            }

            // Construct and post summary comment
            if (comments.length > 0 || suggestedAssignees.size > 0) {
              let summaryComment = `## 🤖 Intelligent Triage Summary\n\n`;
              if (isDryRun) summaryComment = `## 🤖 Intelligent Triage Summary (DRY RUN)\n\n`;

              if (comments.length > 0) {
                summaryComment += comments.map(c => `- ${c}`).join('\n') + '\n\n';
              }

              if (suggestedAssignees.size > 0) {
                summaryComment += `**Suggested Assignees:** ${Array.from(suggestedAssignees).map(a => `@${a}`).join(', ')}\n`;
              }
              summaryComment += `\nTimestamp: ${new Date().toISOString()}`;

              if (!isDryRun) {
                 // Check if a similar triage summary already exists to avoid spamming
                const {data: existingComments} = await github.rest.issues.listComments({ owner, repo, issue_number: issueNumber, per_page: 5 }); // Check last 5 comments
                const previousTriageComment = existingComments.find(c => c.body.includes("🤖 Intelligent Triage Summary"));

                if (previousTriageComment && (new Date().getTime() - new Date(previousTriageComment.created_at).getTime()) < 3600000 && previousTriageComment.user.login === "github-actions[bot]") { // 1 hour
                   console.log("A recent triage summary by this action exists. Skipping new comment to avoid spam.");
                } else {
                   await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: summaryComment });
                   console.log("Posted triage summary comment.");
                }
              } else {
                console.log(`[DRY RUN] Would post comment:\n${summaryComment}`);
              }
            } else {
              console.log("No triage actions or suggestions to report.");
            }

            // --- METRICS & REPORTING (Placeholder) ---
            // In a more advanced setup, you might send data to an external system or aggregate it.
            const metrics = {
              issueNumber,
              labelsAdded: finalLabelsToAdd,
              labelsRemoved: finalLabelsToRemove,
              confidenceScores,
              suggestedAssignees: Array.from(suggestedAssignees),
              timestamp: new Date().toISOString(),
              dryRun: isDryRun
            };
            console.log("Triage Metrics:", JSON.stringify(metrics, null, 2));
            core.setOutput('triage_metrics', JSON.stringify(metrics));

      - name: Output Triage Metrics
        if: always()
        run: |
          echo "Triage metrics for issue #${{ steps.triage.outputs.issue_number || github.event.issue.number }}:"
          echo "${{ steps.triage.outputs.triage_metrics }}"
