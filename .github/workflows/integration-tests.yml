name: Integration Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Cancel in-progress runs for the same ref/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # Fast pre-check to skip heavy jobs on docs-only changes
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.changes.outputs.src-changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for changes
        id: changes
        run: |
          echo "src-changed=true" >> $GITHUB_OUTPUT

          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if [ -n "$BASE_SHA" ]; then
              CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")
            fi
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD 2>/dev/null || echo "")
            fi
          fi

          if [ -n "$CHANGED_FILES" ]; then
            if echo "$CHANGED_FILES" | grep -qvE '^(docs/|README\.md|\.md$|\.github/workflows/gh-deploy\.yml)'; then
              echo "src-changed=true" >> $GITHUB_OUTPUT
            else
              echo "src-changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  test-ubuntu:
    name: Test Python ${{ matrix.python-version }} on Ubuntu
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pixi-environment: "py310"
          - python-version: "3.11"
            pixi-environment: "py311"
          - python-version: "3.12"
            pixi-environment: "py312"

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      websocket-echo:
        image: jmalloc/echo-server:latest
        ports:
          - 8080:8080

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi environment caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.pixi
            .pixi
          key: pixi-${{ runner.os }}-${{ matrix.pixi-environment }}-${{ hashFiles('pixi.lock', 'pyproject.toml') }}
          restore-keys: |
            pixi-${{ runner.os }}-${{ matrix.pixi-environment }}-
            pixi-${{ runner.os }}-

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: ${{ matrix.pixi-environment }}
          cache: true

      - name: Cache project installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            build/
          key: project-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            project-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install project dependencies
        run: |
          pixi install -e ${{ matrix.pixi-environment }}
          pixi run -e ${{ matrix.pixi-environment }} python --version
          pixi run -e ${{ matrix.pixi-environment }} pip install -e . --verbose

      - name: Wait for service containers
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools curl

          timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 2; done'

          timeout 60 bash -c 'until curl -s -f http://localhost:8080/health > /dev/null 2>&1 || curl -s -f http://localhost:8080 > /dev/null 2>&1; do sleep 2; done'

          sleep 5

      - name: Run unit tests with coverage
        run: |
          pixi run -e ${{ matrix.pixi-environment }} pytest tests \
            -m "not integration and not benchmark" \
            --cov=candles_feed \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results-unit.xml \
            --timeout=900 \
            --maxfail=3 \
            --tb=short \
            --disable-warnings \
            -q

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
          WEBSOCKET_ECHO_URL: ws://localhost:8080
          TEST_WITH_SERVICES: true
        run: |
          pixi run -e ${{ matrix.pixi-environment }} pytest tests \
            -m "integration and not benchmark" \
            --cov=candles_feed \
            --cov-append \
            --junitxml=test-results-integration.xml \
            --timeout=1200 \
            --maxfail=2 \
            --tb=short \
            --disable-warnings \
            -q

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ubuntu-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            test-results-*.xml
            coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.10'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          flags: ubuntu,python-${{ matrix.python-version }}

  test-macos:
    name: Test Python 3.12 on macOS
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.src-changed == 'true'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pixi environment caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.pixi
            .pixi
          key: pixi-${{ runner.os }}-py312-${{ hashFiles('pixi.lock', 'pyproject.toml') }}
          restore-keys: |
            pixi-${{ runner.os }}-py312-
            pixi-${{ runner.os }}-

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: py312
          cache: true

      - name: Cache project installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            build/
          key: project-${{ runner.os }}-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            project-${{ runner.os }}-3.12-

      - name: Install project dependencies
        run: |
          pixi install -e py312
          pixi run -e py312 python --version
          pixi run -e py312 pip install -e . --verbose

      - name: Run unit tests
        run: |
          pixi run -e py312 pytest tests \
            -m "not integration and not benchmark" \
            --junitxml=test-results-unit-macos.xml \
            --timeout=900 \
            --maxfail=3 \
            --tb=short \
            --disable-warnings \
            -q

      - name: Run integration tests (no service containers)
        env:
          TEST_WITH_SERVICES: false
        run: |
          pixi run -e py312 pytest tests \
            -m "integration and not benchmark" \
            --junitxml=test-results-integration-macos.xml \
            --timeout=1200 \
            --maxfail=2 \
            --tb=short \
            --disable-warnings \
            -q

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos-${{ github.run_id }}
          path: |
            test-results-*.xml
          retention-days: 14

  integration-status:
    name: "Integration Status"
    runs-on: ubuntu-latest
    needs: [changes, test-ubuntu, test-macos]
    if: always()
    steps:
      - name: Check integration test results
        run: |
          SRC_CHANGED="${{ needs.changes.outputs.src-changed }}"
          if [[ "$SRC_CHANGED" == "false" ]]; then
            echo "No source changes detected - skipping"
            exit 0
          fi

          UBUNTU="${{ needs.test-ubuntu.result }}"
          MACOS="${{ needs.test-macos.result }}"

          if [[ "$UBUNTU" == "success" && "$MACOS" == "success" ]]; then
            echo "All integration tests passed"
            exit 0
          else
            echo "Integration tests failed - Ubuntu: $UBUNTU, macOS: $MACOS"
            exit 1
          fi
