name: Integration Tests (Service Containers)

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.changes.outputs.src-changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for changes
        id: changes
        run: |
          echo "src-changed=true" >> $GITHUB_OUTPUT

          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if [ -n "$BASE_SHA" ]; then
              CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")
            fi
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD 2>/dev/null || echo "")
            fi
          fi

          if [ -n "$CHANGED_FILES" ]; then
            if echo "$CHANGED_FILES" | grep -qvE '^(docs/|README\.md|\.md$|\.github/workflows/gh-deploy\.yml)'; then
              echo "src-changed=true" >> $GITHUB_OUTPUT
            else
              echo "src-changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  test-integration:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            pixi-environment: "py312"

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      websocket-echo:
        image: jmalloc/echo-server:latest
        ports:
          - 8080:8080

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.13
        with:
          environments: ${{ matrix.pixi-environment }}
          cache: true

      - name: Install project
        run: |
          pixi install -e ${{ matrix.pixi-environment }}
          pixi run -e ${{ matrix.pixi-environment }} pip install -e .

      - name: Wait for service containers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools curl > /dev/null
          timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 2; done'
          timeout 60 bash -c 'until curl -s -f http://localhost:8080 > /dev/null 2>&1; do sleep 2; done'
          sleep 3

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
          WEBSOCKET_ECHO_URL: ws://localhost:8080
          TEST_WITH_SERVICES: true
        run: |
          pixi run -e ${{ matrix.pixi-environment }} pytest tests \
            -m "integration and not benchmark" \
            --junitxml=test-results-integration.xml \
            --timeout=1200 \
            --maxfail=2 \
            --tb=short \
            -q

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.python-version }}-${{ github.run_id }}
          path: test-results-*.xml
          retention-days: 14

  integration-status:
    name: Integration Status
    runs-on: ubuntu-latest
    needs: [changes, test-integration]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.outputs.src-changed }}" == "false" ]]; then
            echo "No source changes - skipping"
            exit 0
          fi
          if [[ "${{ needs.test-integration.result }}" == "success" ]]; then
            echo "Integration tests passed"
          else
            echo "Integration tests failed: ${{ needs.test-integration.result }}"
            exit 1
          fi
