[build-system]
requires = [
    "hatchling>=1.18.0",
    "Cython>=3",
    "wheel>=0.37.0",
]
build-backend = "hatchling.build"

[project]
name = "hb-candles-feed"
description = "A Hummingbot candles-feed sub-package"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Memento RC Mori", email = "claude.rc@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.8.0,<3.12",
    "ccxt",
    "numpy>=1.20.0",
    "pandas>=1.0.0",
    "pydantic>=2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/MementoRC/hb-candles-feed"
Documentation = "https://mementorc.github.io/hb-candles-feed"
Repository = "https://github.com/MementoRC/hb-candles-feed/tree/master"

[project.optional-dependencies]
dev = [
    "aioresponses>=0.7.0",
    "pre-commit>=2.15.0",
    "prometheus-client>=0.17.0",
    "pytest>=7.0.0",
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0.0",
    "pyupgrade",
    "ruff>=0.1.6",
    "mypy>=1.5.1",
    "cython-lint>=0.19.0",
    # Enhanced integration testing dependencies
    "redis>=4.5.0",
    "websockets>=11.0.0",
    # Load testing dependencies
    "locust>=2.20.0",
]
doc = [
    "mkdocs",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-material>=8.2.0",
    "mkdocstrings-python",
    "mkdocstrings>=0.18.0",
    "pymdown-extensions>=8.0.0",
]
hummingbot = []

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# Note: Version info is kept in the project section with dynamic = ["version"]
# and managed via candles_feed/__about__.py

[tool.hatch.version]
path = "candles_feed/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["candles_feed"]

# Conda dependencies
# Note: prometheus_client (underscore) is available on conda-forge and included in pixi dev dependencies.
# pip uses prometheus-client (hyphen) while conda uses prometheus_client (underscore).
[tool.pixi.dependencies]
cython = ">=3"
wheel = ">=0.37.0"
aioresponses = "*"
# aioresponses 0.7.8 is incompatible with aiohttp>=3.12 (stream_writer ABI break).
# Pin aiohttp below 3.12 until aioresponses releases a compatible version.
# Upstream issue: https://github.com/pnuckowski/aioresponses/issues/289
aiohttp = ">=3.8.0,<3.12"

# Tasks equivalent to hatch scripts
[tool.pixi.tasks]
test = "pytest tests"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration"
test-load = "pytest tests/load -v"
lint = "ruff check candles_feed tests"
format = "ruff format candles_feed tests"
format-check = "ruff format --check candles_feed tests"
typecheck = "mypy candles_feed"
type-check = "mypy candles_feed"
security = "bandit -c pyproject.toml -r candles_feed/"
lint-cython = "cython-lint candles_feed"
quality = { depends-on = ["lint", "type-check"] }
# live tests excluded — they hit real exchange APIs and fail under geo-restrictions
test-no-live = "pytest tests -m 'not live'"
check = { depends-on = ["format", "lint", "type-check", "test-no-live"] }
check-live = { depends-on = ["format", "lint", "type-check", "test"] }

# Documentation tasks
docs-build = "mkdocs build --clean"
docs-serve = "mkdocs serve --dev-addr localhost:8008"
docs-deploy = "mkdocs gh-deploy"

# Features
[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-git-revision-date-localized-plugin = "*"
mkdocs-material = ">=8.2.0"
mkdocstrings-python = "*"
mkdocstrings = ">=0.18.0"
pymdown-extensions = ">=8.0.0"

[tool.pixi.feature.dev.dependencies]
pre-commit = ">=2.15.0"
pytest = ">=7.0.0"
pytest-aiohttp = ">=1.1.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.11.0"
pytest-timeout = ">=2.1.0"
pytest-xdist = ">=3.0.0"
pytest-benchmark = ">=4.0.0"
pyupgrade = "*"
ruff = ">=0.1.6"
mypy = ">=1.5.1"
cython-lint = ">=0.15.0"
# Prometheus metrics (conda package name uses underscore)
prometheus_client = ">=0.17.0"
# Enhanced integration testing dependencies
redis-py = ">=4.5.0"
websockets = ">=11.0.0"
# Load testing dependencies
locust = ">=2.20.0"

[tool.pixi.feature.ci.dependencies]
ruff = ">=0.1.6"
mypy = ">=1.5.1"
pytest = ">=7.0.0"
pytest-cov = ">=4.1.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
types-setuptools = "*"

[tool.pixi.feature.quality-extended.dependencies]
bandit = ">=1.8.0"
pip-audit = "*"

[tool.pixi.feature.quality-extended.tasks]
security-scan = "bandit -c pyproject.toml -r candles_feed/"
safety-check = "pip-audit"

[tool.pixi.feature.quality-ci.dependencies]
python-build = "*"
hatchling = "*"

[tool.pixi.feature.quality-ci.tasks]
build = "python -m build"

# Python version features
[tool.pixi.feature.py312.dependencies]
python = ">=3.12,<3.13"

# Environments
[tool.pixi.environments]
default = { features = ["dev", "py312"], solve-group = "default" }
docs = { features = ["docs", "py312"], solve-group = "default" }
ci = { features = ["ci", "dev", "py312"], solve-group = "default" }
quality-extended = { features = ["quality-extended", "py312"], solve-group = "default" }
quality-ci = { features = ["quality-ci", "py312"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

# Keep existing tool configurations
[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["candles_feed", "tests"]
omit = [
  "candles_feed/__about__.py",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true
skip_empty = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long - handled by formatter
    "F401",  # unused imports - we'll address these gradually
]
unfixable = ["F401"]  # unused imports - let the developer decide

[tool.ruff.lint.isort]
known-first-party = ["candles_feed"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests",
    "asyncio: marks tests as asyncio tests",
    "benchmark: marks tests as performance benchmarks (deselect with '-m \"not benchmark\"')",
    "live: marks tests that hit real exchange APIs (deselect with '-m \"not live\"')",
]
log_cli = true
log_cli_level = "DEBUG"
# Timeout settings (CI-friendly, can be overridden by --timeout flag)
timeout = 300
timeout_method = "thread"
# CI performance optimizations
addopts = "--strict-markers --strict-config"
minversion = "7.0"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false

# Exclude problematic modules temporarily during infrastructure fixes
exclude = [
    "candles_feed/mocking_resources/.*",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

# Hummingbot sub-package supersession metadata.
# Declares which hummingbot module this sub-package replaces, enabling automated
# compatibility checking and test-skipping in hummingbot CI when this package is installed.
[tool.hummingbot.supersedes]
module = "hummingbot.data_feed.candles_feed"
import_path = "candles_feed.hb_compat"
factory_class = "CandlesFactory"
config_class = "CandlesConfig"
# Hummingbot test paths that this sub-package replaces.
# When this package is importable, these tests are auto-skipped in CI.
test_paths = ["test/hummingbot/data_feed/candles_feed"]
# Only skip tests for exchanges/modules with adapters in this sub-package.
# Tests for HB-only modules keep running unconditionally.
connectors = [
    "aevo_perpetual",
    "ascend_ex",
    "binance",
    "binance_perpetual",
    "bitget",
    "bitget_perpetual",
    "bitmart_perpetual",
    "btc_markets",
    "bybit",
    "bybit_perpetual",
    "coinbase_advanced_trade",
    "dexalot",
    "gate_io",
    "gate_io_perpetual",
    "hyperliquid",
    "hyperliquid_perpetual",
    "kraken",
    "kucoin",
    "kucoin_perpetual",
    "mexc",
    "mexc_perpetual",
    "okx",
    "okx_perpetual",
    "pacifica_perpetual",
]
