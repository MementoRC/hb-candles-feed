# SonarCloud Configuration for Hummingbot Candles Feed
sonar.projectKey=MementoRC_hb-candles-feed
sonar.organization=mementorc

# Project Information
sonar.projectName=Hummingbot Candles Feed
sonar.projectVersion=1.0.0

# Source Configuration
sonar.sources=candles_feed
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python Language Configuration
sonar.python.version=3.10,3.11,3.12

# Coverage Configuration
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results-*.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/.*/**,**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/*.egg-info/**
sonar.test.exclusions=**/test_*.py,**/*_test.py,**/conftest.py

# Code Quality Rules
sonar.qualitygate.wait=true

# Analysis Configuration
sonar.analysis.mode=publish

# Coverage Thresholds (aligned with codecov.yml)
sonar.coverage.exclusions=**/__about__.py,**/test_*.py,**/*_test.py,**/conftest.py,**/setup.py

# Import Issues and Duplications
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Security Configuration
sonar.python.bandit=enabled

# Additional Quality Metrics
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/test_*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S105
sonar.issue.ignore.multicriteria.e2.resourceKey=**/test_*.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/test_*.py